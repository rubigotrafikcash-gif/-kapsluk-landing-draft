name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Codex landing
        working-directory: codex-source
        env:
          SITE_URL: https://rubigotrafikcash-gif.github.io
          BASE_PATH: /-kapsluk-landing-draft/codex/
          ASTRO_TELEMETRY_DISABLED: '1'
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Preserve original Codex build
        run: |
          mkdir -p .codex-dist
          cp -r codex-source/dist/. .codex-dist/
      - name: Build separate fusion concept
        working-directory: codex-source
        env:
          SITE_URL: https://rubigotrafikcash-gif.github.io
          BASE_PATH: /-kapsluk-landing-draft/fusion/
          PUBLIC_CONCEPT_FUSION: 'true'
          ASTRO_TELEMETRY_DISABLED: '1'
        run: |
          npm run check
          npm run build
      - name: Assemble three noindex previews
        run: |
          mkdir -p _site/codex _site/fusion
          cp -r index.html favicon.svg robots.txt .nojekyll _astro v2 _site/
          cp -r .codex-dist/. _site/codex/
          cp -r codex-source/dist/. _site/fusion/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
